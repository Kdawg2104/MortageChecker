# Statement Analyser categorisation rules. Edit freely: plain text, top to bottom, first match wins
# within each pass (see below).
#
#   name:      category shown in the app
#   group:     how analyse.py totals it: income, housing, essential, discretionary, debt, transfer
#   direction: credit (money in), debit (money out) or any
#   merchants: specific merchant/payer names      -> HIGH confidence
#   keywords:  generic words                      -> MEDIUM confidence
#
# Matching is on whole words in the (upper-cased, redacted) description, in two passes:
# every category's merchants first, then every category's keywords. So a specific merchant
# ("YOUTUBE PREMIUM") beats a generic word in an earlier category ("PREMIUM"). No bank names.

categories:
  - name: "Transfers (own accounts)"
    group: transfer
    direction: any
    merchants: ["TRANSFER TO SAVINGS", "TRANSFER FROM SAVINGS", "INTERNAL TRANSFER", "TRANSFER TO OFFSET",
                "TRANSFER FROM OFFSET", "TFR TO OWN", "TFR FROM OWN", "OWN ACCOUNT"]
    keywords: ["TO SAVINGS", "FROM SAVINGS", "OFFSET ACCT", "INTERNAL TFR"]

  - name: "Income – salary"
    group: income
    direction: credit
    merchants: []
    keywords: ["SALARY", "PAYROLL", "WAGES", "WAGE ", "PAY/SALARY", "NET PAY"]

  - name: "Income – other"
    group: income
    direction: credit
    merchants: ["UBER BV", "DOORDASH", "MENULOG DRIVER", "AIRTASKER", "CENTRELINK", "SERVICES AUSTRALIA", "ATO REFUND"]
    keywords: ["PAYOUT", "REFUND", "INTEREST", "DIVIDEND", "REBATE"]

  - name: "Debt – BNPL"
    group: debt
    direction: debit
    merchants: ["AFTERPAY", "ZIP PAY", "ZIPPAY", "ZIP MONEY", "KLARNA", "HUMM", "LATITUDE PAY", "PAYPAL PAY IN 4", "OPENPAY"]
